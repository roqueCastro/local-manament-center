<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Burbuja</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #bubble {
        position: absolute;
        left: 6px;
        top: 6px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(145deg, #3730a3, #1e1b4b);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: none;
        transition: transform 0.12s ease;
      }
      #bubble:hover {
        transform: scale(1.05);
      }
      #bubble.pressed {
        transform: scale(0.94);
      }
      #bubble svg {
        width: 26px;
        height: 26px;
        pointer-events: none;
      }
      #badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        box-sizing: border-box;
        border-radius: 10px;
        border: 2px solid #fff;
        background: #ef4444;
        color: #fff;
        font: 700 10px/16px system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #badge[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="bubble" title="Gestor de tareas (clic derecho: más opciones)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5l4.5 4.5L19 7.5" />
      </svg>
    </div>
    <div id="badge" hidden></div>
    <script type="module" src="/src/bubble.ts"></script>
  </body>
</html>
